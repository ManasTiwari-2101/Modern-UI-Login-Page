<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Modern Login UI</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Tailwind config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              fadeSlide: "fadeSlide 0.35s ease-out",
            },
            keyframes: {
              fadeSlide: {
                "0%": { opacity: 0, transform: "translateY(8px)" },
                "100%": { opacity: 1, transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>

    <style>
      .hidden-form {
        display: none;
      }
    </style>
  </head>

  <body class="min-h-screen bg-gray-200 flex items-center justify-center">
    <!-- CARD -->
    <div
      class=" absolute z-10 w-full max-w-5xl bg-white rounded-2xl shadow-xl grid grid-cols-1 md:grid-cols-2 overflow-hidden"
    >
      <!-- LEFT -->
      <div class="p-10">
        <!-- TOGGLE -->
        <div class="flex gap-6 text-sm mb-8">
          <button
            id="loginTab"
            class="font-semibold border-b-2 border-black pb-1"
          >
            Login
          </button>
          <button id="signupTab" class="text-gray-400 hover:text-black pb-1">
            Sign Up
          </button>
        </div>

        <!-- LOGIN FORM -->
        <div id="loginForm" class="animate-fadeSlide">
          <h1 class="text-2xl font-bold mb-2">Welcome!</h1>
          <p class="text-gray-500 mb-6">Please enter your details to login.</p>

          <div class="space-y-4">
            <input
              type="email"
              placeholder="Email address"
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none"
            />

            <div>
              <input
                type="password"
                placeholder="Password"
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none"
              />
              <div class="text-right mt-1 text-sm">
                <a href="#" class="text-gray-500 hover:text-black"
                  >Forgot password?</a
                >
              </div>
            </div>
          </div>

          <button
            class="w-full mt-6 bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition"
          >
            Log In
          </button>

          <div class="flex items-center my-6">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="mx-4 text-gray-400 text-sm">OR</span>
            <div class="flex-grow border-t border-gray-300"></div>
          </div>

          <div class="space-y-3">
            <button
              class="w-full border py-2 rounded-lg hover:bg-gray-50 flex items-center justify-center gap-3"
            >
              <i class="fa-brands fa-google text-lg"></i>
              Continue with Google
            </button>

            <button
              class="w-full border py-2 rounded-lg hover:bg-gray-50 flex items-center justify-center gap-3"
            >
              <i class="fa-brands fa-apple text-lg"></i>
              Continue with Apple
            </button>

            <button
              class="w-full border py-2 rounded-lg hover:bg-gray-50 flex items-center justify-center gap-3"
            >
              <i class="fa-solid fa-wallet text-lg"></i>
              Continue with Wallet
            </button>
          </div>

          <p class="text-sm text-center mt-6">
            Don't have an account?
            <button onclick="showSignup()" class="font-semibold">
              Sign up
            </button>
          </p>
        </div>

        <!-- SIGN UP FORM -->
        <div id="signupForm" class="hidden-form animate-fadeSlide">
          <h1 class="text-2xl font-bold mb-2">Create Account</h1>
          <p class="text-gray-500 mb-6">Join us by creating a new account.</p>

          <div class="space-y-4">
            <input
              type="text"
              placeholder="Full name"
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none"
            />

            <input
              type="email"
              placeholder="Email address"
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none"
            />

            <input
              type="password"
              placeholder="Password"
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none"
            />
          </div>

          <button
            class="w-full mt-6 bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition"
          >
            Create Account
          </button>

          <p class="text-sm text-center mt-6">
            Already have an account?
            <button onclick="showLogin()" class="font-semibold">Login</button>
          </p>
        </div>
      </div>

      <!-- RIGHT IMAGE -->
      <div class="relative hidden md:block">
        <img
          src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c"
          class="w-full h-full object-cover"
          alt="property"
        />

        <div
          class="absolute bottom-6 left-6 right-6 bg-black/50 text-white p-4 rounded-xl backdrop-blur"
        >
          <p class="text-sm italic">
            “This is my log-in page inspired from Dribble ”
          </p>

          <div class="mt-4">
            <p class="font-semibold">Manas Tiwari</p>
            <p class="text-xs text-gray-300">Student</p>
            <p class="text-xs text-gray-300">Fun Activty</p>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script>
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      const loginTab = document.getElementById("loginTab");
      const signupTab = document.getElementById("signupTab");

      function showSignup() {
        loginForm.classList.add("hidden-form");
        signupForm.classList.remove("hidden-form");

        loginTab.classList.remove("border-black", "font-semibold");
        signupTab.classList.add("border-black", "font-semibold");
      }

      function showLogin() {
        signupForm.classList.add("hidden-form");
        loginForm.classList.remove("hidden-form");

        signupTab.classList.remove("border-black", "font-semibold");
        loginTab.classList.add("border-black", "font-semibold");
      }

      signupTab.addEventListener("click", showSignup);
      loginTab.addEventListener("click", showLogin);
    </script>
  </body>
</html>
